# Night light / gamma adjustment
exec wlsunset -l 52.37 -L 4.89 -t 4000 -T 4500 -g 0.85

# Wallpaper daemon
exec LaunchSwww

# Notification daemon
exec dunst

# Idle management (lock + screen off)
exec swayidle -w \
    timeout 300 'swaylock -f -c 000000' \
    timeout 600 'swaymsg "output * dpms off"' \
        resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -f -c 000000'

# Auto-tiling script
exec_always autotiling

exec systemctl --user set-environment XDG_CONFIG_HOME="$HOME/.config"
exec systemctl --user set-environment GTK_USE_PORTAL=0
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway
exec systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr
