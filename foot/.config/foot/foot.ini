# Font
font=JetBrainsMono NF medium:size=16
font-bold=JetBrainsMono NF medium:weight=bold:size=16
font-italic=JetBrainsMono NF medium:slant=italic:size=16
font-bold-italic=JetBrainsMono NF medium:weight=bold:slant=italic:size=16
dpi-aware=yes

# Window size
initial-window-size-pixels=1400x800

# Terminal
term=xterm-256color

# Transparency
[colors]
alpha=0.70
cursor=282827 ebdbb2

# Cursor
[cursor]
color= 002b36 93a1a1
style=block
blink=no

# Colors
[colors-dark]
background=282827
foreground=ebdbb2

regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

# Selection
selection-foreground=282828
selection-background=928374

# Cursor colors
cursor=ebdbb2

# URL color
urls=458588

# Scrollback (optional tuning)
[scrollback]
lines=10000
multiplier=3.0

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# Disable bell visual noise
[bell]
system=no
visual=no
